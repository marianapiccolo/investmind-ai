name: InvestMind AI CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Docker build and Django tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: investmind-ci
      DEVELOPMENT_NETWORK: investmind-ci_default
      PRODUCTION_TEST_ENV_FILE: .env

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY='ci-only-not-for-production-0123456789abcdef0123456789abcdef'
          DJANGO_DEBUG=true
          POSTGRES_DB=investmind_ci
          POSTGRES_USER=investmind_ci
          POSTGRES_PASSWORD=ci-only-db-password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          OPENAI_API_KEY=ci-not-a-real-openai-key
          ALPHA_VANTAGE_API_KEY=ci-not-a-real-market-key
          EOF

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --project-name investmind-ci-production -f compose.production-test.yaml config --quiet

      - name: Build development image
        run: docker compose build --pull web

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait --wait-timeout 120 db redis

      - name: Apply database migrations
        run: docker compose run --rm --no-deps web python manage.py migrate --noinput

      - name: Check for missing migrations
        run: docker compose run --rm --no-deps web python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: docker compose run --rm --no-deps web python manage.py test --noinput

      - name: Build production image
        run: docker compose --project-name investmind-ci-production -f compose.production-test.yaml build --pull web

      - name: Check production settings
        run: >-
          docker compose --project-name investmind-ci-production
          -f compose.production-test.yaml run --rm --no-deps
          -e DJANGO_LOCAL_PRODUCTION_TEST=false
          web python manage.py check --deploy

      - name: Start Gunicorn for smoke tests
        run: >-
          docker compose --project-name investmind-ci-production
          -f compose.production-test.yaml up -d --wait --wait-timeout 120 web

      - name: Verify admin page and static CSS
        run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/admin/login/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/static/admin/css/base.css

      - name: Show service logs on failure
        if: failure()
        run: |
          if [[ -f .env ]]; then
            docker compose --project-name investmind-ci-production -f compose.production-test.yaml logs --no-color --tail=100 web
            docker compose logs --no-color --tail=100 db redis
          fi

      - name: Clean up CI resources
        if: always()
        run: |
          if [[ -f .env ]]; then
            docker compose --project-name investmind-ci-production -f compose.production-test.yaml down --remove-orphans
            docker compose down --volumes --remove-orphans
          fi

name: InvestMind AI CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Docker build and Django tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: investmind-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY='ci-only-not-for-production-0123456789abcdef'
          DJANGO_DEBUG=true
          POSTGRES_DB=investmind_ci
          POSTGRES_USER=investmind_ci
          POSTGRES_PASSWORD=ci-only-db-password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          OPENAI_API_KEY=ci-not-a-real-openai-key
          ALPHA_VANTAGE_API_KEY=ci-not-a-real-market-key
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build --pull web

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait --wait-timeout 120 db redis

      - name: Apply database migrations
        run: docker compose run --rm --no-deps web python manage.py migrate --noinput

      - name: Check for missing migrations
        run: docker compose run --rm --no-deps web python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: docker compose run --rm --no-deps web python manage.py test --noinput

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 db redis

      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
name: investmind-ai-local

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: investmind-ai:local
  init: true
  working_dir: /app
  env_file:
    - .env
  environment:
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: "redis://redis:6379/1"
    CELERY_BROKER_URL: "redis://redis:6379/2"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command:
      - celery
      - -A
      - config.celery:app
      - worker
      - --loglevel=INFO
      - --concurrency=2

  beat:
    <<: *app
    command:
      - celery
      - -A
      - config.celery:app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data:
  redis_data:
